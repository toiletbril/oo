name: Integration Tests

on:
  workflow_dispatch:
  push:
    branches: [ master, staging ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends \
            clang-20 make libcap-dev libcap2-bin iptables nftables mold

      - name: Build
        run: make MODE=asan CXX=clang++ oo

      - name: Create non-root test user
        run: |
          sudo useradd --system --create-home --shell /bin/bash oouser
          sudo chown -R oouser:oouser $PWD

      - name: Run init
        run: sudo ./oo init

      - name: Run tests
        run: sudo -u oouser -- make MODE=asan test

      - name: Run root tests
        run: sudo make MODE=asan test

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-logs
          path: |
            test/trace.log
            test/failed.diff
            test/root/trace.log
            test/root/failed.diff
          if-no-files-found: ignore

      - name: Summary on failure
        if: failure()
        shell: sh
        run: |
          {
            for d in test test/root; do
              if test -s "$d/failed.diff"; then
                echo "### $d/failed.diff"
                echo '```diff'
                cat "$d/failed.diff"
                echo '```'
              fi
              if test -s "$d/trace.log"; then
                echo "### $d/trace.log"
                echo '```log'
                cat "$d/trace.log"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
